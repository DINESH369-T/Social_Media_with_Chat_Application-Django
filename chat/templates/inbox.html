<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .inbox-container {
            max-width: 750px;
            margin: 60px auto;
        }

        .inbox-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(40, 40, 90, 0.10);
            overflow: hidden;
        }

        .inbox-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
        }

        .inbox-header h2 {
            margin: 0;
            font-weight: 700;
        }

        .chat-user {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px 22px;
            border-bottom: 1px solid #eee;
            text-decoration: none;
            color: #292b45;
            transition: 0.2s;
        }

        .chat-user:hover {
            background: #f3f0ff;
            color: #5b21b6;
        }

        .chat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ede9fe;
            color: #6d28d9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .empty-message {
            padding: 45px 20px;
            text-align: center;
            color: #777;
        }
        .back-btn {
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: white;
            color: #5b21b6;
        }
    </style>
</head>

<body>

<div class="container inbox-container">
    <div class="inbox-card">

<div class="inbox-header">

    <div class="d-flex align-items-center justify-content-between">

        <h2>💬 Your Inbox</h2>
        <a href="{% url 'home' %}" class="back-btn">
            ← Back to Home
        </a>
        </div>
            <p class="mb-0 mt-2">Connect and chat with other users</p>
        </div>

        <div>
            {% for user in users %}
                <a class="chat-user"
                   href="{% url 'chat_room' user.username %}">

                    <div class="chat-icon">👤</div>

                    <div>
                        <h6 class="mb-1 fw-bold">
                            {{ user.username }}
                        </h6>
                        <small class="text-muted">
                            Open conversation
                        </small>
                    </div>

                    <span class="ms-auto">➜</span>
                </a>

            {% empty %}
                <div class="empty-message">
                    <h5>No conversations yet</h5>
                    <p class="mb-0">
                        Start chatting with someone to see them here.
                    </p>
                </div>
            {% endfor %}
        </div>

    </div>
</div>

</body>
</html>
