
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SocialConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef2ff, #ede9fe, #f5f3ff);
            font-family: Arial, sans-serif;
            padding: 25px 12px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(60, 40, 120, 0.13);
        }

        .auth-title {
            color: #4f46e5;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .auth-card form p {
            margin-bottom: 18px;
        }

        .auth-card label {
            display: block;
            font-weight: 600;
            color: #393653;
            margin-bottom: 7px;
        }

        .auth-card input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #dcd9ed;
            border-radius: 9px;
            outline: none;
        }

        .auth-card input:focus {
            border-color: #6d5ce7;
            box-shadow: 0 0 0 3px rgba(109, 92, 231, 0.12);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-weight: 600;
            margin-top: 8px;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .auth-link {
            color: #6d5ce7;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fff0f0;
            color: #dc3545;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .bottom-text {
            text-align: center;
            margin-top: 23px;
            color: #777;
        }

        .helptext {
            display: block;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .errorlist {
            color: #dc3545;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <h2 class="auth-title">Create Account</h2>

    <p class="auth-subtitle">
        Join our community and start connecting.
    </p>

    {% for msg in messages %}
        <div class="error-message">
            {{ msg }}
        </div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="auth-btn">
            Register
        </button>
    </form>

    <div class="bottom-text">
        Already have an account?
        <a href="{% url 'login' %}" class="auth-link">
            Login
        </a>
    </div>

</div>

</body>
</html>
